<text x="240" y="226" fill="#e2e8f0" text-anchor="end">Random weights, whole frame</text><rect x="250" y="210" width="7" height="24" rx="3" fill="#64748b"/><text x="264" y="227" fill="#e2e8f0">0.020</text>
<text x="240" y="266" fill="#e2e8f0" text-anchor="end">Raw pixels</text><rect x="249" y="250" width="2" height="24" fill="#64748b"/><text x="258" y="267" fill="#e2e8f0">-0.001</text>
</g>
<rect x="488" y="76" width="68" height="224" fill="#34d399" opacity="0.12"/>
<text x="526" y="92" fill="#34d399" font-size="11" text-anchor="middle">highest G that</text><text x="526" y="106" fill="#34d399" font-size="11" text-anchor="middle">noise allows: 0.66-0.85</text><text x="526" y="120" fill="#34d399" font-size="11" text-anchor="middle">(dev worlds)</text>
