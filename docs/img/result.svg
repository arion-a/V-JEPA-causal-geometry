<text x="430" y="320" fill="#94a3b8" font-size="12" text-anchor="middle">0.5</text>
<text x="610" y="320" fill="#94a3b8" font-size="12" text-anchor="middle">1.0</text>
<text x="240" y="106" fill="#e2e8f0" text-anchor="end">V-JEPA, whole frame</text><rect x="250" y="90" width="105" height="24" rx="4" fill="#a78bfa"/><text x="362" y="107" fill="#e2e8f0">0.293</text>
<text x="240" y="146" fill="#e2e8f0" text-anchor="end">V-JEPA, object window</text><rect x="250" y="130" width="41" height="24" rx="4" fill="#a78bfa"/><text x="298" y="147" fill="#e2e8f0">0.114</text>
