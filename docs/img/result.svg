<text x="765" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">97.5% interval -0.157 to 0.315</text>
<text x="765" y="186" fill="#cbd5e1" font-size="12" text-anchor="middle">object window: -0.031</text>
