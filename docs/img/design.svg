<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="470" rx="14" fill="#0f172a"/>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/></marker>
</defs>
<text x="450" y="30" fill="#f1f5f9" font-size="19" font-weight="700" text-anchor="middle">When gravity changes, does V-JEPA's representation move the same way in every scene?</text>
<text x="450" y="50" fill="#94a3b8" font-size="12" text-anchor="middle">Clip = one simulated video: 64 frames, 1 second, 384 x 384 pixels. Representation = the 1024-number vector V-JEPA outputs for a clip.</text>
<g font-size="13" text-anchor="middle">
<text x="130" y="82" fill="#94a3b8" font-weight="700">1. CHANGE ONLY GRAVITY</text>
<rect x="24" y="94" width="212" height="86" rx="10" fill="#1e293b" stroke="#38bdf8"/>
<text x="130" y="116" fill="#38bdf8" font-weight="700">Freefall scene</text><text x="130" y="136" fill="#cbd5e1">clip with g = 8.8, clip with g = 10.8</text><text x="130" y="156" fill="#94a3b8" font-size="12">same world, no floor, base g = 9.8</text>
<rect x="24" y="190" width="212" height="86" rx="10" fill="#1e293b" stroke="#fb923c"/>
<text x="130" y="212" fill="#fb923c" font-weight="700">Bounce scene</text><text x="130" y="232" fill="#cbd5e1">clip with g = 8.8, clip with g = 10.8</text><text x="130" y="252" fill="#94a3b8" font-size="12">restitution e = 0.6 unchanged</text>
<rect x="24" y="286" width="212" height="86" rx="10" fill="#1e293b" stroke="#34d399"/>
<text x="130" y="308" fill="#34d399" font-weight="700">Incline scene</text><text x="130" y="328" fill="#cbd5e1">clip with g = 8.8, clip with g = 10.8</text><text x="130" y="348" fill="#94a3b8" font-size="12">friction mu = 0.25 unchanged</text>
<text x="400" y="82" fill="#94a3b8" font-weight="700">2. REPRESENT</text>
<rect x="312" y="170" width="176" height="130" rx="10" fill="#1e293b" stroke="#a78bfa"/>
<text x="400" y="196" fill="#a78bfa" font-weight="700">V-JEPA 2.1, frozen</text><text x="400" y="218" fill="#cbd5e1">ViT-L 384, never trained</text><text x="400" y="236" fill="#cbd5e1">or changed here</text><text x="400" y="260" fill="#cbd5e1">one 1024-number vector</text><text x="400" y="278" fill="#cbd5e1">per clip</text>
<text x="710" y="82" fill="#94a3b8" font-weight="700">3. COMPARE THE REPRESENTATION CHANGES</text>
<rect x="540" y="94" width="340" height="278" rx="10" fill="#1e293b" stroke="#475569"/>
</g>
<g stroke-width="3" marker-end="url(#p)" fill="none">
<line x1="610" y1="320" x2="760" y2="150" stroke="#38bdf8"/>
<line x1="610" y1="320" x2="800" y2="210" stroke="#fb923c"/>
<line x1="610" y1="320" x2="690" y2="132" stroke="#34d399"/>
</g>
<g font-size="12">
<text x="766" y="146" fill="#38bdf8">freefall</text>
<text x="806" y="216" fill="#fb923c">bounce</text>
<text x="640" y="128" fill="#34d399">incline</text>
<text x="872" y="114" fill="#fbbf24" font-size="11" text-anchor="end">illustrative arrows, not measured data</text>
<text x="552" y="346" fill="#cbd5e1">Each arrow = vector(g = 10.8) minus vector(g = 8.8),</text>
<text x="552" y="362" fill="#cbd5e1">averaged over the 15 held-out worlds of that scene</text>
<text x="710" y="268" fill="#fbbf24" font-weight="700">G = average cosine between</text>
<text x="710" y="284" fill="#fbbf24" font-weight="700">the 3 pairs of arrows</text>
<text x="710" y="302" fill="#cbd5e1">1 = same direction, 0 = unrelated</text>
</g>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M238 137 L310 200"/><path d="M238 233 H310"/><path d="M238 329 L310 270"/><path d="M490 235 H538"/></g>
<text x="450" y="404" fill="#cbd5e1" font-size="13" text-anchor="middle">High G: a gravity change moves the representation in the same direction in every scene.</text>
<text x="450" y="424" fill="#cbd5e1" font-size="13" text-anchor="middle">Low G: the direction depends on the scene.</text>
<text x="450" y="448" fill="#94a3b8" font-size="12" text-anchor="middle">The same calculation is run on three baselines: raw pixels, V-JEPA with random weights, and the object's tracked trajectory.</text>
</svg>
