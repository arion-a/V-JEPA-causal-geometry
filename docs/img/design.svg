<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="400" rx="14" fill="#0f172a"/>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/></marker>
</defs>
<text x="450" y="32" fill="#f1f5f9" font-size="20" font-weight="700" text-anchor="middle">The question: does changing gravity move the encoding the same way in every scene?</text>
<g font-size="13" text-anchor="middle">
<text x="130" y="68" fill="#94a3b8" font-weight="700">1. INTERVENE (change only gravity g)</text>
<rect x="24" y="82" width="212" height="78" rx="10" fill="#1e293b" stroke="#38bdf8"/>
<text x="130" y="106" fill="#38bdf8" font-weight="700">Freefall</text><text x="130" y="128" fill="#cbd5e1">g = 8.8 clip vs g = 10.8 clip</text><text x="130" y="146" fill="#94a3b8" font-size="12">nothing else changes</text>
<rect x="24" y="170" width="212" height="78" rx="10" fill="#1e293b" stroke="#fb923c"/>
<text x="130" y="194" fill="#fb923c" font-weight="700">Bounce</text><text x="130" y="216" fill="#cbd5e1">g = 8.8 clip vs g = 10.8 clip</text><text x="130" y="234" fill="#94a3b8" font-size="12">floor and restitution fixed</text>
<rect x="24" y="258" width="212" height="78" rx="10" fill="#1e293b" stroke="#34d399"/>
<text x="130" y="282" fill="#34d399" font-weight="700">Incline</text><text x="130" y="304" fill="#cbd5e1">g = 8.8 clip vs g = 10.8 clip</text><text x="130" y="322" fill="#94a3b8" font-size="12">slope and friction fixed</text>
<text x="400" y="68" fill="#94a3b8" font-weight="700">2. ENCODE</text>
<rect x="320" y="150" width="160" height="110" rx="10" fill="#1e293b" stroke="#a78bfa"/>
<text x="400" y="182" fill="#a78bfa" font-weight="700">Frozen V-JEPA 2.1</text><text x="400" y="204" fill="#cbd5e1">no training</text><text x="400" y="222" fill="#cbd5e1">1024-number feature</text><text x="400" y="240" fill="#cbd5e1">per clip</text>
<text x="700" y="68" fill="#94a3b8" font-weight="700">3. COMPARE THE CHANGE IN THE ENCODING</text>
<rect x="540" y="82" width="340" height="254" rx="10" fill="#1e293b" stroke="#475569"/>
</g>
<g stroke-width="3" marker-end="url(#p)" fill="none">
<line x1="610" y1="300" x2="760" y2="130" stroke="#38bdf8"/>
<line x1="610" y1="300" x2="800" y2="190" stroke="#fb923c"/>
<line x1="610" y1="300" x2="690" y2="112" stroke="#34d399"/>
</g>
<g font-size="12">
<text x="766" y="126" fill="#38bdf8">freefall</text>
<text x="806" y="196" fill="#fb923c">bounce</text>
<text x="640" y="108" fill="#34d399">incline</text>
<text x="610" y="324" fill="#cbd5e1" text-anchor="middle">feature(g+) minus feature(g-)</text>
<text x="710" y="258" fill="#cbd5e1">angle between arrows</text>
<text x="710" y="274" fill="#fbbf24" font-weight="700">G = mean cosine</text>
</g>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M238 125 L318 180"/><path d="M238 209 H318"/><path d="M238 297 L318 232"/><path d="M482 205 H538"/></g>
<text x="450" y="366" fill="#cbd5e1" font-size="13" text-anchor="middle">Arrows agree (G near 1): the model tracks the mechanism. Arrows disagree: it tracks what each scene looks like.</text>
<text x="450" y="386" fill="#94a3b8" font-size="12" text-anchor="middle">Same calculation is run on raw pixels, random weights and the tracked trajectory as baselines.</text>
</svg>
